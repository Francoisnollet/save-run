# Exemple de configuration SAVE Run. Copiez en config.yaml et adaptez.
intention: >-
  Classe le ticket de support client dans une seule catégorie parmi :
  facturation, technique, livraison, autre.

# Optionnel : le prompt actuel, utilisé comme référence pour chiffrer l'économie.
base_prompt: >-
  Tu es un agent de support client très rigoureux, en charge du tri des tickets. Lis attentivement
  le message du client, repère le sujet principal, puis classe le ticket dans une seule catégorie
  parmi : facturation, technique, livraison, autre. Exemples : « Je n'ai pas reçu ma facture de
  septembre » donne facturation ; « L'application se ferme au démarrage » donne technique ; « Mon
  colis est bloqué depuis cinq jours » donne livraison ; « Pouvez-vous me rappeler le numéro de mon
  contrat ? » donne autre. Réfléchis étape par étape avant de répondre : identifie les indices,
  écarte les catégories improbables, puis écris la catégorie finale après « Réponse : ». Ne donne
  jamais d'explication dans la réponse finale, uniquement le nom de la catégorie. En cas
  d'hésitation entre deux catégories, choisis celle qui correspond au problème principal du client.

# Optionnel : le modèle qui exécute aujourd'hui le prompt actuel (doit figurer dans `models`).
# Sans `base_prompt` et `current_model`, le rapport affiche les coûts mais aucun chiffre d'économie.
current_model: modele-exemple-anthropic

# Optionnel : active la variante de persona « métier ».
role: un agent de support client expérimenté

models:
  - id: modele-exemple-anthropic        # identifiant exact chez le fournisseur
    provider: anthropic
    api_key_env: SAVERUN_ANTHROPIC_KEY
    rpm: 50                             # requêtes par minute
    # temperature: 0                    # optionnel ; absent = non envoyé à l'API
  - id: modele-exemple-compatible
    provider: openai_compatible
    base_url: https://exemple.invalid/v1   # À VÉRIFIER dans la documentation du fournisseur
    api_key_env: EXEMPLE_API_KEY
    rpm: 30

n_variants: 20
runs_per_case: 1
seuil_qualite: 0.75
validation_part: 0.25
max_calls: 2000
max_tokens: 300        # plafond de tokens en sortie par appel (relevez-le pour le raisonnement ou le JSON long)
scoring: exact            # exact | json_fields
# Optionnel : comment le modèle doit répondre. Ajouté à CHAQUE variante générée, même sans exemple.
# Recommandé avec json_fields : sans lui, un avertissement s'affiche (les variantes ne sauraient pas quel JSON produire).
# output_format: 'Réponds avec le JSON brut uniquement, sans texte avant ou après : {"categorie": "..."}'
# fields: [categorie]     # json_fields seulement ; par défaut, toutes les clés de `expected`
# monthly_volume: 50000   # optionnel : appels par mois, pour chiffrer l'économie
seed: 0                   # graine de la séparation des cas et des variantes
