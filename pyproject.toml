[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "saverun"
version = "0.1.0"
description = "Trouve le couple prompt x modèle le moins cher qui démontre un seuil de qualité."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["anthropic", "openai", "pyyaml", "rich"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
saverun = "saverun.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
