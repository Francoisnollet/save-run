[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "saverun"
version = "0.1.0"
description = "Trouve le couple prompt x modèle le moins cher qui démontre un seuil de qualité."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "François Nollet" }]
requires-python = ">=3.11"
dependencies = ["anthropic", "openai", "pyyaml", "rich"]

[project.urls]
Homepage = "https://github.com/Francoisnollet/save-run"
Issues = "https://github.com/Francoisnollet/save-run/issues"

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
saverun = "saverun.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
